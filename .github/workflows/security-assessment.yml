name: Security assessment

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Approved HTTPS origin to assess'
        required: true
        default: 'https://amuseical.com'
        type: string

permissions:
  contents: read

jobs:
  assess:
    name: Low-impact external assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser smoke checks
        run: npx playwright install --with-deps chromium
      - name: Run assessment
        env:
          SECURITY_TARGET: ${{ inputs.target }}
          SECURITY_ALLOWED_HOSTS: amuseical.com
          SECURITY_ALLOWED_ORIGINS: https://amuseical.com
          SECURITY_REQUIRE_HTTPS: 'true'
        run: |
          mkdir -p security-artifact
          set +e
          node scripts/security-assessment.mjs \
            --target "$SECURITY_TARGET" \
            --report security-artifact/assessment.md \
            --json security-artifact/assessment.json
          status=$?
          test -f security-artifact/assessment.md
          test -f security-artifact/assessment.json
          exit "$status"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment
          path: security-artifact/
          retention-days: 30
