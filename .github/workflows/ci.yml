name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- build / smoke -------------------------------------------------------
  # Parse every .js/.mjs without executing it (catches syntax errors in the
  # browser modules that nothing else ever imports), then boot the real server
  # and curl the served player page — proof the app starts and serves a bundle.
  build:
    name: Build / smoke (syntax + server boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Check syntax of all JS/MJS files
        run: |
          find server shared public/js scripts -name '*.js' -o -name '*.mjs' \
            | xargs node --check
      - name: Boot server and curl the served page
        run: |
          PORT=3111 node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3111/healthz" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3111/healthz" | grep -q '"ok":true'
          curl -fsS "http://127.0.0.1:3111/" | grep -qi 'solo'
          curl -fsS "http://127.0.0.1:3111/shared/cups.js" | grep -q 'cupsSwapMs'
          kill "$SERVER_PID" 2>/dev/null || true

  # ---- code graph / freshness ----------------------------------------------
  # Static consistency the test suite structurally cannot cover: the browser
  # modules have no build step, so nothing else ever parses them, and nothing
  # else checks that a game on the server roster has a client and a tutorial.
  # Also enforces that the knowledge graph is not stale against source files.
  code-graph:
    name: Code graph / freshness (npm run check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run check

  # ---- unit / integration --------------------------------------------------
  # Core unit + integration suite on the oldest supported Node version.
  unit:
    name: Unit / integration (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm test

  # ---- regressions ---------------------------------------------------------
  # The named regression suites, run first for a fast, focused signal, then the
  # full suite — across every other Node version the package supports (20 is
  # covered by `unit`). Every 20-player concurrency bug surfaces differently
  # across Node's timer and socket behaviour, and the issue #46 cups suite is
  # the dedicated ten-level / completion-scoring regression guard.
  regressions:
    name: Regressions (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Named regression suites (issue #46 + #51 wordhunt + #50 stroop + #54 room/late-join + harness + roster + #55 host-controls)
        run: node --test test/cups-ten-level.test.js test/cups.test.js test/harness.test.js test/roster.test.js test/wordhunt.test.js test/stroop.test.js test/room.test.js
      - name: Reduced-motion regression (#52)
        run: node --test test/reduced-motion.test.js
      - name: Color-cue regression (#53)
        # Asserts non-color cues for trace (dashed texture), area (BIG/SMALL labels),
        # chairs avatars (name/initial), and stroop label parity. Seed/scoring invariance
        # is also checked. Lives in test/color-cues.test.js.
        run: node --test test/color-cues.test.js
      - name: Full test suite
        run: npm test

  # ---- Playwright (Chromium) -----------------------------------------------
  # The real-browser proof: cups-solo drives real pointer input through all ten
  # levels of Follow the Cup against a freshly booted server. On failure the
  # HTML report and traces are uploaded for triage.
  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run Playwright (Chromium)
        env:
          CI: '1'
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---- dependency audit ----------------------------------------------------
  # This runs in a room of real people on a real network; a high-severity
  # advisory in a small dependency tree is worth stopping for.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  # ---- one-shot PR #63 production verification ----------------------------
  # Manual only, branch locked, and removed before merge. Railway deploys the
  # exact reviewed SHA; a blocking assessment automatically restores main.
  security-remediation-deploy:
    name: Security remediation / deploy and assess
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/security-assessment'
    runs-on: ubuntu-latest
    needs: [build, code-graph, unit, regressions, e2e, audit]
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 2f10b595-19db-4a3b-a33d-740da4c1f0ef
      RAILWAY_ENVIRONMENT_ID: 25f1bbe8-98d0-4f0f-a2e5-f0cf48183f45
      RAILWAY_SERVICE_ID: 3ab62eab-6ee0-4c3b-bffd-29d4eb31338c
      SECURITY_ALLOWED_HOSTS: amuseical.com
      SECURITY_ALLOWED_ORIGINS: https://amuseical.com
      SECURITY_REQUIRE_HTTPS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Install assessment browser and Railway CLI
        run: |
          npx playwright install --with-deps chromium
          npm install --global @railway/cli
      - name: Upload this exact reviewed SHA
        id: deploy
        run: |
          test -n "$RAILWAY_API_TOKEN"
          railway up --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "PR #63 security remediation $GITHUB_SHA"
          for attempt in $(seq 1 30); do
            latest=$(railway deployment list --json \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_SERVICE_ID" )
            state=$(printf '%s' "$latest" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);const x=Array.isArray(d)?d[0]:(d.deployments||[])[0];process.stdout.write((x&&x.status)||'')})")
            echo "latest deployment status: ${state:-unknown}"
            case "$state" in
              DONE|SUCCESS) exit 0 ;;
              FAILED|ERROR) echo 'Deployment failed.' >&2; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo 'Deployment did not finish in time.' >&2
          exit 1
      - name: Verify production cutover
        id: cutover
        run: |
          for attempt in $(seq 1 60); do
            headers=$(curl -fsSI https://amuseical.com/ || true)
            if printf '%s' "$headers" | tr -d '\r' | grep -qi "content-security-policy: default-src 'none'"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Fixed revision did not become observable at the production origin.' >&2
          exit 1
      - name: Run bounded redacted production assessment
        id: assessment
        continue-on-error: true
        run: |
          mkdir -p security-artifact
          node scripts/security-assessment.mjs \
            --target https://amuseical.com \
            --report security-artifact/assessment.md \
            --json security-artifact/assessment.json
      - name: Upload assessment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-assessment-${{ github.sha }}
          path: security-artifact/
          retention-days: 30
      - name: Roll back to main if deployment or assessment fails
        if: always() && steps.deploy.outcome == 'success' && (steps.cutover.outcome != 'success' || steps.assessment.outcome != 'success')
        run: |
          git checkout --detach origin/main
          railway up --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "Rollback after PR #63 assessment failure"
          exit 1
